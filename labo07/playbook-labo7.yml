- name: Labo07
  hosts: host
  gather_facts: true
  gather_subset:
    - "!all"
    - "os_family"
  become: true
  roles:
    # gebruiker aanmaken
    - { role: createuser, username: "{{ newuser }}", userpass: "{{ userpasswd }}", tags: user }
    - { role: grantsudo, username: "{{ newuser }}", tags: user }
    # hostname veranderen
    - { role: naam, hostname: "terminal", tags: hostname }
    # docker installeren
    - { role: dockerinstall, user: "{{ newuser }}", tags: install }

  tasks:  # docker containers opzetten
    - name: prepare project environment
      tags:
        - prep
      block:
        - name: Create project directory
          ansible.builtin.file:
            path: "{{ project_dir }}"
            state: directory
            mode: '0755'
            owner: "{{ newuser }}"
            group: "{{ newuser }}"

        - name: Create subdirectories
          ansible.builtin.file:
            path: "{{ project_dir }}/{{ item }}"
            state: directory
            mode: '0755'
            owner: "{{ newuser }}"
            group: "{{ newuser }}"
          with_items:
            - build

        - name: Provision dockerfile
          ansible.builtin.template:
            src: templates/dockerfile.jinja2
            dest: "{{ project_dir }}/build/Dockerfile"
            mode: '0644'
            owner: "{{ newuser }}"
            group: "{{ newuser }}"

        - name: Provision I did it web page
          ansible.builtin.template:
            src: templates/ididit.html.jinja2
            dest: "{{ project_dir }}/build/ididit.html"
            mode: '0644'
            owner: "{{ newuser }}"
            group: "{{ newuser }}"

        - name: Provision Docker Compose file
          ansible.builtin.template:
            src: templates/docker-compose.yml.jinja2
            dest: "{{ project_dir }}/docker-compose.yml"
            mode: '0644'
            owner: "{{ newuser }}"
            group: "{{ newuser }}"

    - name: Deploy containers with Docker Compose
      tags:
        - deploy
      block:
        - name: start containers
          community.docker.docker_compose_v2:
            project_src: "{{ project_dir }}"
            state: present

  vars:
    - newuser: dokwerker
    - userpasswd: "{{ lookup('file', 'userpasswd') }}"
    - project_dir: "/home/{{ newuser }}/staging_area"
