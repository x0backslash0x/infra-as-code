- name: Labo 5 Ansible & Windows
  hosts: wintest
  gather_facts: False
  tasks:
  # - name: update Windows
  #   win_updates:
  #     category_names:
  #       - SecurityUpdates
  #       - CriticalUpdates

  - name: change hostname
    ansible.windows.win_hostname:
      name: "{{ host_name }}"
    register: res
  
  - name: reboot
    ansible.windows.win_reboot:
    when: res.reboot_required

  vars:
    host_name: "{{ lookup('file', 'hostname') }}"
