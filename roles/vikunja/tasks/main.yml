---
# tasks file for vikunja
- name: prepare environment
  block:
  - name: create volume directories
    ansible.builtin.file:
      path: "{{ project_dir }}/{{ item }}"
      state: directory
    with_items:
      - db
      - files
  # - name: create directories for SSL assets
  #   ansible.builtin.file:
  #     path: "{{ project_dir }}/{{ cert_basedir }}/{{ item }}"
  #     state: directory
  #   with_items:
  #     - private
  #     - csr
  #     - certs
  - name: copy nginx config
    ansible.builtin.template:
      src: "default-https.conf.jinja2"
      dest: "{{ project_dir }}/default-https.conf"
  tags:
    - prep

- name: generate self-signed certificate
  import_role:
    name: certify
  vars:
    start_dir: "{{ project_dir }}"
    cert_commonname: "{{ cert_cn }}"
#   block:
#     - name: generate private key
#       community.crypto.openssl_privatekey:
#         path: "{{ project_dir }}/{{ cert_privatekey }}"
#         type: "RSA"
#         size: 4096
#         mode: "600"
#     - name: create signing request
#       community.crypto.openssl_csr:
#         privatekey_path: "{{ project_dir }}/{{ cert_privatekey }}"
#         path: "{{ project_dir }}/{{ cert_request }}"
#         common_name: "{{ cert_cn }}"
#         mode: "644"
#     - name: generate self-signed certificate
#       community.crypto.x509_certificate:
#         privatekey_path: "{{ project_dir }}/{{ cert_privatekey }}"
#         csr_path: "{{ project_dir }}/{{ cert_request }}"
#         provider: "selfsigned"
#         selfsigned_digest: sha512
#         selfsigned_not_after: +3m  # valid for 3 months
#         path: "{{ project_dir }}/{{ cert_path }}"
#         mode: "644"
  tags:
    - cert

- name: deploy containers
  block:
    - name: create shared network
      community.docker.docker_network:
        name: "{{ network_name }}"
    - name: start database container
      community.docker.docker_container:
        name: db
        image: mariadb:10
        volumes:
          - ./db:/var/lib/mysql
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "true"
          MYSQL_USER: "{{ db_user_name | string }}"
          MYSQL_PASSWORD: "{{ db_user_pass | string }}"
          MYSQL_DATABASE: "{{ db_name | string }}"
        networks:
          - name: "{{ network_name }}"
        healthcheck:
          test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $MYSQL_USER --password=$MYSQL_PASSWORD"]
          interval: 2s
          start_period: 30s
        state: "healthy"
    - name: start vikunja container
      community.docker.docker_container:
        name: vikunja
        image: vikunja/vikunja
        volumes:
          - ./files:/app/vikunja/files
        env:
          VIKUNJA_DATABASE_HOST: "db"
          VIKUNJA_DATABASE_USER: "{{ db_user_name | string }}"
          VIKUNJA_DATABASE_PASSWORD: "{{ db_user_pass | string }}"
          VIKUNJA_DATABASE_TYPE: "mysql"
          VIKUNJA_DATABASE_DATABASE: "{{ db_name | string }}"
          VIKUNJA_SERVICE_JWTSECRET: "{{ jwt_secret | string }}"
        published_ports:
          - 3456:3456
        networks:
          - name: "{{ network_name }}"
        detach: true
    - name: start reverse-proxy container
      community.docker.docker_container:
        name: rproxy
        image: nginx:1.27
        volumes:
          # - ./default-http.conf:/etc/nginx/conf.d/default.conf
          - "{{ project_dir }}/default-https.conf:/etc/nginx/conf.d/default.conf"
          - "{{ project_dir }}/{{ cert_path }}:/etc/nginx/{{ cert_path }}"
          - "{{ project_dir }}/{{ cert_privatekey }}:/etc/nginx/{{ cert_privatekey }}"
        published_ports:
          - 80:80
          - 443:443
        networks:
          - name: "{{ network_name }}"
  tags:
    - deploy
