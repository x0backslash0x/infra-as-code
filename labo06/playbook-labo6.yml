- hosts: wintest
  gather_facts: false
  tasks:
  - name: chocolatey  # executionpolicy no op "bypass" zetten
    win_chocolatey:
      name: chocolatey
      state: present
      source: https://community.chocolatey.org/install.ps1

  - name: install 7zip
    win_chocolatey:
      name: 7zip
      version: '24.9.0'
      state: present

  - name: Install Dropbox
    win_chocolatey:
      name: dropbox
      version: '220.4.4126'
      state: present

  - name: Install Greenshot
    win_chocolatey:
      name: greenshot
      version: '1.2.10.6'
      state: present

  - name: Install Irfanview
    win_chocolatey:
      name: irfanview
      version: '4.70.0'
      state: present

  - name: Install firefox
    win_chocolatey:
      name: firefox
      version: '136.0.4'
      state: present

  - name: Install Okular
    win_chocolatey:
      name: okular
      version: '24.12.0'
      state: present

  - name: Install python
    win_chocolatey:
      name: python
      version: '3.13.2'
      state: present

  - name: Install Notepad++
    win_chocolatey:
      name: notepadplusplus.install
      version: '8.7.8'
      state: present

