- name: Labo07
  hosts: host
  gather_facts: true
  gather_subset:
    - "!all"
    - "os_family"
  become: true
  roles:
    - { role: createuser, username: "{{ newuser }}", userpass: "{{ userpasswd }}" }
    - { role: dockerinstall, user: "{{ newuser }}" }

  vars:
    - newuser: dokwerker
    - userpasswd: "{{ lookup('file', 'userpasswd') }}"

# htpasswd --method=sha-512 <password> > userpasswd
# ansible-playbook playbook-labo07.yml
