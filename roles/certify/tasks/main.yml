---
# tasks file for certify
- name: create directories for SSL assets
  ansible.builtin.file:
    path: "{{ cert_basedir }}/{{ item }}"
    state: directory
  with_items:
    - private
    - csr
    - certs

  # check for an existing key first
- name: generate certificate key  # used for the csr & certificate
  community.crypto.openssl_privatekey:
    path: "{{ cert_private_key_path }}"
    type: "RSA"
    size: 4096
    mode: "600"

  # check for an existing key first
- name: generate Let's Encrypt account key  # used for let's encrypt account authentication
  community.crypto.openssl_privatekey:
    path: "{{ acme_account_key }}"
    type: "RSA"
    size: 4096
    mode: "600"
  when: provider == "letsencrypt"

  # check for an existing valid request first
- name: create signing request
  community.crypto.openssl_csr:
    privatekey_path: "{{ cert_private_key_path }}"
    path: "{{ cert_csr }}"
    common_name: "{{ cert_commonname }}"
    mode: "644"

- name: request Let's Encrypt certificate
  block:  # using http-01 challenge
    - name: create challenge
      acme_certificate:
        acme_directory: "{{ acme_directory_production }}"
        acme_version: 2
        challenge: http-01
        terms_agreed: yes
        account_key_src: "{{ acme_account_key }}"
        csr: "{{ cert_csr }}"
        dest: "{{ cert_path }}"
        fullchain_dest: "{{ cert_fullchain }}"
      register: "http_challenge"
    - name: fulfill challenge
      block:
        - name: create validation directory
          ansible.builtin.file:
            path: "{{ cert_basedir }}/{{ acme_challenge_dir }}"
            state: directory
        - name: start webserver
          community.docker.docker_container:
            name: validation
            image: nginx:1.27
            volumes:
              - "{{ cert_basedir }}/{{ acme_challenge_dir }}/:/usr/share/nginx/html/{{ acme_challenge_dir }}/"
            published_ports:
              - 80:80
        - name: create validation resource
          ansible.builtin.copy:
            content: "{{ http_challenge['challenge_data'][cert_commonname]['http-01']['resource_value'] }}"
            dest: "{{ cert_basedir }}/{{ http_challenge['challenge_data'][cert_commonname]['http-01']['resource'] }}"
        - name: validate challenge
          acme_certificate:
            acme_directory: "{{ acme_directory_production }}"
            acme_version: 2
            challenge: http-01
            account_key_src: "{{ acme_account_key }}"
            csr: "{{ cert_csr }}"
            dest: "{{ cert_path }}"
            fullchain_dest: "{{ cert_fullchain }}"
            chain_dest: "{{ cert_chain }}"
            data: "{{ http_challenge }}"
        - name: stop webserver
          community.docker.docker_container:
            name: validation
            state: stopped
      when: http_challenge is changed and cert_commonname in http_challenge['challenge_data']
  when: provider == "letsencrypt"

- name: generate self-signed certificate
  community.crypto.x509_certificate:
    privatekey_path: "{{ cert_private_key_path }}"
    csr_path: "{{ cert_csr }}"
    provider: "selfsigned"
    selfsigned_digest: sha512
    selfsigned_not_after: +3m  # valid for 3 months
    path: "{{ cert_path }}"
    mode: "644"
  when: provider == "self-signed"

- name: add facts
  ansible.builtin.set_fact:
    cert_basedir: "{{ start_dir }}/ssl"
    acme_challenge_dir: ".well-known/acme-challenge"
    cert_private_key_path: "{{ cert_private_key_path }}"
    cert_private_key_file: "{{ cert_private_key_file }}"
    cert_path: "{{ cert_path }}"
    cert_file: "{{ cert_file }}"
    cert_commonname: "{{ cert_commonname }}"
