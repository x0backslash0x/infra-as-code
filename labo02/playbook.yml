- name: Infrastructure As Code Labo 2
  hosts: managed-nodes
  tasks:

  - name: SELinux als permissive instellen
    ansible.builtin.command: setenforce 0
    become: yes

  - name: hostname aanpassen
    ansible.builtin.command: hostname bahamut
    become: yes

  - name: bestand aanmaken
    ansible.builtin.command: touch /test.txt
    become: yes

  - name: gebruiker jacko aanmaken
    ansible.builtin.user:
      name: jacko
      comment: voor Jan
    become: yes

  - name: SSH authorized key voor jacko instellen
    ansible.posix.authorized_key:
      user: jacko
      state: present
      key: "ssh-rsa  jacko@MacBook-Pro.local"
    become: yes

  - name: Docker - install dnf plugin
    ansible.builtin.dnf:
      name: dnf-plugins-core
      state: present
    become: yes
