- name: docker install
  hosts: intro
  user: root

  tasks:
  - name: spel installeren
    yum:
     name:
      - spel-release

  - name: installeer yum utils
    yum:
     name: yum-utils
     state: latest

  - name: Installeer device-mapper-persistent-data
    yum:
      name: device-mapper-persistent-data
      state: latest

  - name: Installeer lvm2
    yum:
      name: lvm
      state: latest

  - name: Voeg de Docker ce repo toe
    get_url:
      url: https://download.docker.com/linux/centos/docker-ce.repo
      dest: /etc/yum.repos.d/docker-ce.repo
    become: yes

  - name: Enable Docker Edge repo
    init_file:
      dest: /etc/yum.repos.d/docker-ce.repo
      section: 'docker-ce-edge'
      option: enabled
      value: 0
    become: yes

  - name: Installeer Docker
    package:
      name: docker-ce
      state: latest
    become: yes

  - name: Start Docker service
    service:
      name: docker
      state: started
      enabled: yes
    become: yes

  - name: Docker gebruiker aanmaken
    user:
      name: dokwerker
      comment: tunnel user

  - name: Add user dokwerker to docker group
    user:
      name: dokwerker
      groups: docker
      append: yes

  - name: Key zetten voor root
    authorized_keys:
      user: root
      state: present
      key: "{{ lookup('file', '/users/jacko/.ssh/id_rsa.pub') }}"
